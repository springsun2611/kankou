<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일본 관광 명소 게임</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
   body {
    font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
    /* 화사한 핑크 톤 배경색 */
    background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
    color: #1e293b;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
}
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .speech-bubble {
            position: relative;
            background: #ffffff;
            color: #0f172a;
            border-radius: 1.25rem;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 24px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>
    <div id="root" class="w-full h-full min-h-screen min-h-[100dvh] flex items-center justify-center p-3 sm:p-6"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // pure SVG 그래픽 컴포넌트 (외부 이미지 오류 영구 방지)
        const GraphicArt = ({ type }) => {
            if (type === 'hokkaido') {
                return (
                    <svg viewBox="0 0 400 240" class="w-full h-full object-cover">
                        <rect width="400" height="240" fill="#091b36"/>
                        <polygon points="40,240 160,80 280,240" fill="#1e3a66"/>
                        <polygon points="120,133 160,80 200,133" fill="#ffffff"/>
                        <polygon points="150,240 270,60 390,240" fill="#172e54"/>
                        <polygon points="230,120 270,60 310,120" fill="#ffffff"/>
                        <circle cx="80" cy="50" r="3" fill="#ffffff" opacity="0.8"/>
                        <circle cx="180" cy="30" r="4" fill="#ffffff" opacity="0.9"/>
                        <circle cx="290" cy="45" r="2.5" fill="#ffffff" opacity="0.7"/>
                        <circle cx="340" cy="70" r="3.5" fill="#ffffff" opacity="0.8"/>
                        <circle cx="120" cy="85" r="2" fill="#ffffff" opacity="0.6"/>
                    </svg>
                );
            }
            if (type === 'tokyo') {
                return (
                    <svg viewBox="0 0 400 240" class="w-full h-full object-cover">
                        <rect width="400" height="240" fill="#200b2c"/>
                        <polygon points="200,20 180,240 220,240" fill="#ef4444"/>
                        <line x1="200" y1="20" x2="200" y2="240" stroke="#f87171" stroke-width="4"/>
                        <line x1="187" y1="100" x2="213" y2="100" stroke="#ffffff" stroke-width="3"/>
                        <line x1="182" y1="160" x2="218" y2="160" stroke="#ffffff" stroke-width="4"/>
                        <circle cx="200" cy="100" r="4" fill="#fef08a"/>
                        <rect x="0" y="200" width="400" height="40" fill="#0f172a"/>
                        <circle cx="70" cy="60" r="2" fill="#ffffff" opacity="0.5"/>
                        <circle cx="330" cy="80" r="2.5" fill="#ffffff" opacity="0.6"/>
                    </svg>
                );
            }
            if (type === 'osaka_kyoto') {
                return (
                    <svg viewBox="0 0 400 240" class="w-full h-full object-cover">
                        <rect width="400" height="240" fill="#3b1111"/>
                        <rect x="150" y="80" width="100" height="120" fill="#f59e0b" rx="10"/>
                        <circle cx="200" cy="110" r="16" fill="#ffffff"/>
                        <line x1="200" y1="126" x2="200" y2="165" stroke="#ffffff" stroke-width="6"/>
                        <line x1="200" y1="135" x2="180" y2="110" stroke="#ffffff" stroke-width="5"/>
                        <line x1="200" y1="135" x2="220" y2="110" stroke="#ffffff" stroke-width="5"/>
                        <line x1="200" y1="165" x2="182" y2="195" stroke="#ffffff" stroke-width="6"/>
                        <line x1="200" y1="165" x2="218" y2="195" stroke="#ffffff" stroke-width="6"/>
                        <rect x="0" y="200" width="400" height="40" fill="#1e1b4b"/>
                    </svg>
                );
            }
            if (type === 'kyushu') {
                return (
                    <svg viewBox="0 0 400 240" class="w-full h-full object-cover">
                        <rect width="400" height="240" fill="#064e3b"/>
                        <ellipse cx="200" cy="190" rx="160" ry="45" fill="#0ea5e9"/>
                        <ellipse cx="200" cy="190" rx="140" ry="35" fill="#38bdf8"/>
                        <path d="M130,150 Q120,120 140,90" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>
                        <path d="M200,140 Q190,110 210,80" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.7"/>
                        <path d="M270,150 Q260,120 280,90" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>
                        <circle cx="80" cy="180" r="20" fill="#334155"/>
                        <circle cx="320" cy="185" r="24" fill="#334155"/>
                    </svg>
                );
            }
            return null;
        };

        const LOCATIONS = {
            hokkaido: {
                id: 'hokkaido',
                name: '홋카이도',
                jpName: '北海道 (ほっかいどう)',
                landmarks: ['하코다테 (函館)', '눈 축제 (ゆきまつり)'],
                badgeBg: 'bg-blue-600',
                dialogue: [
                    {
                        speaker: '가이드 하나',
                        jp: 'いらっしゃいませ！北海道(ほっかいどう)へ ようこそ！',
                        roma: 'Irasshaimase! Hokkaido e yokoso!',
                        kr: '어서오세요! 홋카이도에 오신 것을 환영합니다!',
                        reaction: { jp: 'こんにちは！', kr: '안녕하세요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: 'ここは 函館(はこだて)の 夜景(やけい)と ゆきまつりが　ゆうめいです。',
                        roma: 'Koko wa Hakodate no yakei to Yukimatsuri ga yuumai desu.',
                        kr: '여기는 하코다테의 야경과 눈 축제가 유명합니다.',
                        reaction: { jp: 'きれいですね！', kr: '아름답네요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: 'あたたかい お茶(ちゃ)は どうですか？',
                        roma: 'Atatakai ocha wa dou desu ka?',
                        kr: '따뜻한 차는 어떠신가요?',
                        reaction: { jp: 'いいですね！', kr: '좋네요!' }
                    }
                ],
                quiz: {
                    question: '홋카이도 대표 겨울 축제의 이름을 고르세요.',
                    options: ['ゆきまつり (눈 축제)', 'おんせん (온천)', 'あさくさ (아사쿠사)'],
                    answer: 0
                }
            },
            tokyo: {
                id: 'tokyo',
                name: '도쿄',
                jpName: '東京 (とうきょう)',
                landmarks: ['수도 (首都)', '아사쿠사 (浅草)'],
                badgeBg: 'bg-purple-600',
                dialogue: [
                    {
                        speaker: '가이드 하나',
                        jp: 'いらっしゃいませ！日本(にほん)の 首都(しゅと)、東京(とうきょう)です！',
                        roma: 'Irasshaimase! Nihon no shuto, Tokyo desu!',
                        kr: '어서오세요! 일본의 수도, 도쿄입니다!',
                        reaction: { jp: 'こんにちは！', kr: '안녕하세요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: 'ここは 浅草(あさくさ)が とても ゆうめいです。',
                        roma: 'Koko wa Asakusa ga totemo yuumai desu.',
                        kr: '여기는 아사쿠사가 매우 유명합니다.',
                        reaction: { jp: 'きれいですね！', kr: '아름답네요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: '浅草(あさくさ)の さんぽは どうですか？',
                        roma: 'Asakusa no sanpo wa dou desu ka?',
                        kr: '아사쿠사 산책은 어떠신가요?',
                        reaction: { jp: 'いいですね！', kr: '좋네요!' }
                    }
                ],
                quiz: {
                    question: '도쿄의 유명한 역사 명소는 어디일까요?',
                    options: ['きんかくじ (금각사)', 'あさくさ (아사쿠사)', 'どうとんぼり (도톤보리)'],
                    answer: 1
                }
            },
            osaka_kyoto: {
                id: 'osaka_kyoto',
                name: '오사카 / 교토',
                jpName: '大阪・京都 (おおさか・きょうと)',
                landmarks: ['도톤보리 (道頓堀)', '금각사 (金閣寺)'],
                badgeBg: 'bg-amber-600',
                dialogue: [
                    {
                        speaker: '가이드 하나',
                        jp: 'いらっしゃいませ！大阪(おおさか)と 京都(きょうと)へ ようこそ！',
                        roma: 'Irasshaimase! Osaka to Kyoto e yokoso!',
                        kr: '어서오세요! 오사카와 교토에 오신 것을 환영합니다!',
                        reaction: { jp: 'こんにちは！', kr: '안녕하세요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: '道頓堀(どうとんぼり)と 金閣寺(きんかくじ)が　ゆうめいです。',
                        roma: 'Doutonbori to Kinkakuji ga yuumai desu.',
                        kr: '도톤보리와 금각사가 유명합니다.',
                        reaction: { jp: 'きれいですね！', kr: '아름답네요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: 'たこ焼き(やき)は どうですか？',
                        roma: 'Takoyaki wa dou desu ka?',
                        kr: '타코야키는 어떠신가요?',
                        reaction: { jp: 'いいですね！', kr: '좋네요!' }
                    }
                ],
                quiz: {
                    question: '교토의 아름다운 금빛 사찰 이름은?',
                    options: ['きんかくじ (금각사)', 'ぎんかくじ (은각사)', 'あさくさ (아사쿠사)'],
                    answer: 0
                }
            },
            kyushu: {
                id: 'kyushu',
                name: '규슈',
                jpName: '九州 (きゅうしゅう)',
                landmarks: ['후쿠오카 (福岡)', '온천 (おんせん)'],
                badgeBg: 'bg-emerald-600',
                dialogue: [
                    {
                        speaker: '가이드 하나',
                        jp: 'いらっしゃいませ！九州(きゅうしゅう)へ ようこそ！',
                        roma: 'Irasshaimase! Kyushu e yokoso!',
                        kr: '어서오세요! 규슈에 오신 것을 환영합니다!',
                        reaction: { jp: 'こんにちは！', kr: '안녕하세요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: '福岡(ふくおか)と 温泉(おんせん)が とても ゆうめいです。',
                        roma: 'Fukuoka to Onsen ga totemo yuumai desu.',
                        kr: '후쿠오카와 온천이 매우 유명합니다.',
                        reaction: { jp: 'きれいですね！', kr: '아름답네요!' }
                    },
                    {
                        speaker: '가이드 하나',
                        jp: '温泉(おんせん)は どうですか？',
                        roma: 'Onsen wa dou desu ka?',
                        kr: '온천은 어떠신가요?',
                        reaction: { jp: 'いいですね！', kr: '좋네요!' }
                    }
                ],
                quiz: {
                    question: '규슈 대표 명소는?',
                    options: ['ふくおか (후쿠오카)', 'とうきょう (도쿄)', 'はこだて (하코다테)'],
                    answer: 0
                }
            }
        };

        function App() {
            const [selectedRegion, setSelectedRegion] = useState(null);
            const [step, setStep] = useState(0);
            const [score, setScore] = useState(0);
            const [showQuiz, setShowQuiz] = useState(false);
            const [quizSelected, setQuizSelected] = useState(null);
            const [quizCorrect, setQuizCorrect] = useState(null);

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const cleanText = text.replace(/\([^)]*\)/g, '');
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = 'ja-JP';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const currentData = selectedRegion ? LOCATIONS[selectedRegion] : null;
            const currentDialogue = currentData ? currentData.dialogue[step] : null;

            useEffect(() => {
                if (currentDialogue) {
                    speakText(currentDialogue.jp);
                }
            }, [selectedRegion, step]);

            const handleSelectRegion = (key) => {
                setSelectedRegion(key);
                setStep(0);
                setShowQuiz(false);
                setQuizSelected(null);
                setQuizCorrect(null);
            };

            const handleNextStep = () => {
                if (!currentDialogue) return;
                speakText(currentDialogue.reaction.jp);
                setScore(prev => prev + 10);

                setTimeout(() => {
                    if (step < currentData.dialogue.length - 1) {
                        setStep(prev => prev + 1);
                    } else {
                        setShowQuiz(true);
                    }
                }, 800);
            };

            const handleQuizCheck = (idx) => {
                setQuizSelected(idx);
                const isRight = idx === currentData.quiz.answer;
                setQuizCorrect(isRight);
                if (isRight) setScore(prev => prev + 30);
            };

            if (!selectedRegion) {
                return (
                    <div className="w-full max-w-4xl flex flex-col items-center justify-center gap-6 my-auto">
                        <div className="text-center">
                            <span className="bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold px-4 py-1.5 rounded-full text-sm sm:text-base tracking-wide">
                                どこへ 行きますか？ (어디로 갈까요?)
                            </span>
                            <h1 className="text-2xl sm:text-4xl font-black text-white mt-3">
                                방문할 일본 명소를 선택하세요!
                            </h1>
                            <p className="text-slate-400 text-xs sm:text-sm mt-2">
                                가이드의 이야기를 듣고 일본어 반응 버튼을 눌러보세요.
                            </p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                            {Object.keys(LOCATIONS).map((key) => {
                                const loc = LOCATIONS[key];
                                return (
                                    <div
                                        key={key}
                                        onClick={() => handleSelectRegion(key)}
                                        className="group relative rounded-2xl overflow-hidden glass-panel border border-slate-700/80 hover:border-rose-500 cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-xl min-h-[160px] sm:min-h-[180px] flex flex-col justify-end p-5"
                                    >
                                        <div className="absolute inset-0 z-0 opacity-60 group-hover:opacity-85 transition-opacity">
                                            <GraphicArt type={key} />
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent" />
                                        </div>

                                        <div className="relative z-10">
                                            <span className={`${loc.badgeBg} text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1 inline-block`}>
                                                {loc.name}
                                            </span>
                                            <h2 className="text-xl sm:text-2xl font-black text-white group-hover:text-rose-300 transition-colors">
                                                {loc.jpName}
                                            </h2>
                                            <div className="flex flex-wrap gap-1.5 mt-2">
                                                {loc.landmarks.map((lm, i) => (
                                                    <span key={i} className="text-xs bg-slate-900/80 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md">
                                                        📍 {lm}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full max-w-4xl flex flex-col gap-3 sm:gap-4 my-auto">
                    <div className="flex items-center justify-between gap-2">
                        <button
                            onClick={() => setSelectedRegion(null)}
                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border border-slate-700 flex items-center gap-2 transition shrink-0"
                        >
                            <i className="fa-solid fa-arrow-left"></i>
                            <span>도시 다시 선택</span>
                        </button>

                        <div className="flex gap-1.5 overflow-x-auto py-1">
                            {Object.keys(LOCATIONS).map((key) => {
                                const loc = LOCATIONS[key];
                                const isActive = selectedRegion === key;
                                return (
                                    <button
                                        key={key}
                                        onClick={() => handleSelectRegion(key)}
                                        className={`py-1.5 px-3 rounded-lg font-bold text-xs transition border whitespace-nowrap ${
                                            isActive
                                                ? 'bg-rose-600 text-white border-rose-400'
                                                : 'bg-slate-900/80 text-slate-400 hover:text-white border-slate-800'
                                        }`}
                                    >
                                        {loc.name}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="relative rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl glass-panel min-h-[440px] sm:min-h-[500px] flex flex-col justify-between border border-slate-700">
                        <div className="absolute inset-0 z-0 opacity-40">
                            <GraphicArt type={selectedRegion} />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent" />
                        </div>

                        <div className="relative z-10 p-4 sm:p-6 flex justify-between items-start">
                            <div>
                                <span className={`${currentData.badgeBg} text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider`}>
                                    {currentData.name} 관광 안내
                                </span>
                                <h1 className="text-xl sm:text-3xl font-black text-white mt-1.5">
                                    {currentData.jpName}
                                </h1>
                                <div className="flex flex-wrap gap-1.5 mt-2">
                                    {currentData.landmarks.map((lm, i) => (
                                        <span key={i} className="text-xs bg-slate-900/80 text-slate-300 border border-slate-700 px-2.5 py-0.5 rounded-md">
                                            📍 {lm}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-slate-900/90 border border-amber-500/50 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl sm:rounded-2xl flex items-center gap-2 shrink-0">
                                <i className="fa-solid fa-trophy text-amber-400 text-sm sm:text-lg"></i>
                                <span className="font-bold text-amber-300 text-sm sm:text-lg">{score} Pt</span>
                            </div>
                        </div>

                        {!showQuiz ? (
                            <div className="relative z-10 p-4 sm:p-6 flex flex-col gap-4 sm:gap-6">
                                <div className="flex items-end gap-3 sm:gap-4">
                                    <div className="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 border-2 border-white flex items-center justify-center text-xl sm:text-2xl shadow-lg shrink-0">
                                        👩‍💼
                                    </div>
                                    <div className="speech-bubble p-4 sm:p-5 flex-1 shadow-xl">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-xs font-bold text-rose-600">{currentDialogue.speaker}</span>
                                            <button
                                                onClick={() => speakText(currentDialogue.jp)}
                                                className="text-slate-500 hover:text-rose-600 transition"
                                                title="다시 듣기"
                                            >
                                                <i className="fa-solid fa-volume-high text-base sm:text-lg"></i>
                                            </button>
                                        </div>
                                        <p className="text-lg sm:text-2xl font-black text-slate-900 tracking-wide">
                                            {currentDialogue.jp}
                                        </p>
                                        <p className="text-xs text-slate-500 mt-0.5 font-mono">
                                            {currentDialogue.roma}
                                        </p>
                                        <p className="text-xs sm:text-sm font-semibold text-slate-700 mt-2 border-t border-slate-200 pt-1.5">
                                            {currentDialogue.kr}
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-slate-900/90 backdrop-blur border border-slate-700/80 rounded-xl sm:rounded-2xl p-4 sm:p-5">
                                    <p className="text-xs font-bold text-slate-400 mb-3 flex items-center gap-1.5">
                                        <i className="fa-solid fa-hand-pointer text-rose-400"></i>
                                        아래 버튼을 눌러 가이드에게 대답하고 다음으로 넘어가세요!
                                    </p>
                                    <button
                                        onClick={handleNextStep}
                                        className="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-left p-4 rounded-xl border border-rose-400 transition-all shadow-lg hover:shadow-rose-500/25 active:scale-98 flex items-center justify-between"
                                    >
                                        <div>
                                            <div className="text-xl font-black text-white">
                                                {currentDialogue.reaction.jp}
                                            </div>
                                            <div className="text-xs text-rose-100 mt-0.5 font-medium">
                                                {currentDialogue.reaction.kr}
                                            </div>
                                        </div>
                                        <div className="bg-white/20 rounded-lg p-2.5 text-white">
                                            <i className="fa-solid fa-arrow-right text-lg"></i>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="relative z-10 p-5 m-4 sm:m-6 bg-slate-900/95 rounded-2xl border border-rose-500/40 text-center">
                                <span className="bg-rose-500/20 text-rose-300 text-xs font-bold px-3 py-1 rounded-full uppercase border border-rose-500/30">
                                    명소 복습 퀴즈
                                </span>
                                <h2 className="text-lg sm:text-2xl font-bold mt-3 text-white">
                                    {currentData.quiz.question}
                                </h2>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3 mt-5">
                                    {currentData.quiz.options.map((opt, i) => {
                                        const isSel = quizSelected === i;
                                        return (
                                            <button
                                                key={i}
                                                onClick={() => handleQuizCheck(i)}
                                                disabled={quizSelected !== null}
                                                className={`p-3.5 rounded-xl font-bold transition text-xs sm:text-base border ${
                                                    quizSelected === null
                                                        ? 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-white'
                                                        : isSel
                                                            ? quizCorrect
                                                                ? 'bg-emerald-600 border-emerald-400 text-white'
                                                                : 'bg-rose-600 border-rose-400 text-white'
                                                            : 'bg-slate-800/50 border-slate-800 text-slate-500'
                                                }`}
                                            >
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                                {quizCorrect !== null && (
                                    <div className="mt-5 flex flex-col items-center gap-3">
                                        <p className={`text-base sm:text-lg font-bold ${quizCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                            {quizCorrect ? '🎉 정답입니다! (+30 Pt)' : '😅 아쉬워요! 다시 도전해 보세요.'}
                                        </p>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => {
                                                    setStep(0);
                                                    setShowQuiz(false);
                                                    setQuizSelected(null);
                                                    setQuizCorrect(null);
                                                }}
                                                className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-4 rounded-xl transition text-xs sm:text-sm border border-slate-700"
                                            >
                                                다시 학습
                                            </button>
                                            <button
                                                onClick={() => setSelectedRegion(null)}
                                                className="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-lg text-xs sm:text-sm"
                                            >
                                                다른 도시로 이동
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
